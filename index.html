'use strict';const SEED=JSON.parse(document.getElementById('seed').textContent),KEY='os-life-v1';let state=structuredClone(SEED);let page='overview',selected=today(),timerLeft=25*60,timerEnd=0,timerInterval=null,timerDate=null,timerKind='study',toastT;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),num=v=>Number(v)||0,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),pct=v=>v==null?'—':Math.round(v*100)+'%',fmt=(v,n=1)=>v==null?'—':Number(v).toFixed(n).replace(/\.0$/,''),has=(d,k)=>d[k]!==undefined&&d[k]!==null&&d[k]!=='';function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function plus(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function daynum(s){return Math.round((Date.parse(s)-Date.parse(state.settings.start))/86400000)+1}function weeknum(s){return clamp(Math.ceil(daynum(s)/7),1,12)}function day(s=selected){return state.days[s]||{}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Storage unavailable. Export a backup to retain your changes.')}}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),2500)}function setDay(k,v){const d=state.days[selected]??={};if(v===''||v==null)delete d[k];else d[k]=v;if(!Object.keys(d).length)delete state.days[selected];save();render()}function selectDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||!Number.isFinite(Date.parse(s)))return;selected=s;render()}function shiftDate(n){selectDate(plus(selected,n))}function go(p){page=p;$('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}function dateLabel(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}const groups=[{name:'Morning ritual',icon:'☀',sub:'90-minute block · faith & routine',habits:[['fajr','Fajr prayer',''],['azkar','Morning & evening Azkar','15 min'],['quran','Quran memorization','20 min'],['episode','Islamic / Path episode','20 min'],['journal','Journaling','5 min'],['reading','Reading / reinforcement','10 min'],['stretch','Stretching exercises','5 min'],['bed','Make bed / scent room','5 min']]},{name:'Fitness',icon:'◈',sub:'Training & nutrition',habits:[['training','Training completed',''],['meal','Post-workout meal','']]},{name:'English mastery',icon:'Aa',sub:'Four core skills',habits:[['speaking','Speaking practice',''],['listening','Listening practice',''],['vocab','Vocabulary',''],['grammar','Grammar / writing','']]},{name:'Research & deep reading',icon:'✳',sub:'20 minutes daily',habits:[['research','Research session completed','20 min']]},{name:'Creator studio',icon:'◎',sub:'20 minutes daily',habits:[['reel','Reel idea created',''],['carousel','Carousel / story idea','']]},{name:'Digital discipline',icon:'◐',sub:'Personal boundaries',habits:[['screenBefore','Screen-free 30 min before bed',''],['screenLow','Low screen time',''],['noMusic','No music violation',''],['noSocial','No random social media','']]}];const habitKeys=groups.flatMap(g=>g.habits.map(h=>h[0]));function ratio(d,keys){return keys.some(k=>has(d,k))?keys.filter(k=>d[k]===true).length/keys.length:null}function sleep(d){if(!/^\d\d:\d\d$/.test(d.sleepIn||'')||!/^\d\d:\d\d$/.test(d.wake||''))return null;const m=s=>Number(s.slice(0,2))*60+Number(s.slice(3));return ((m(d.wake)-m(d.sleepIn)+1440)%1440)/60}function score(d){const keys=[...habitKeys,'trainingMinutes','englishMinutes','sleepIn','wake','phone','energy','mood','focus'];if(!keys.some(k=>has(d,k)))return null;const sl=sleep(d);return (ratio(d,groups[0].habits.map(h=>h[0]))||0)*.3+(ratio(d,['training','meal'])||0)*.15+(ratio(d,['speaking','listening','vocab','grammar'])||0)*.15+(d.re function correlation(pairs){const a=pairs.filter(([x,y])=>x!=null&&y!=null&&Number.isFinite(x)&&Number.isFinite(y));if(a.length<3)return null;const x=mean(a.map(p=>p[0])),y=mean(a.map(p=>p[1]));let n=0,xx=0,yy=0;for(const [u,v] of a){n+=(u-x)*(v-y);xx+=(u-x)**2;yy+=(v-y)**2}return xx&&yy?n/Math.sqrt(xx*yy):null}function analytics(){const all=logged(selected),ds=all.map(([,d])=>d),sleepVals=ds.map(sleep).filter(x=>x!=null),avg=mean(ds.map(score)),focus=mean(ds.map(d=>has(d,'focus')?num(d.focus):null)),corr=correlation(ds.map(d=>[sleep(d),score(d)])),debt=sleepVals.reduce((a,b)=>a+Math.max(0,state.settings.sleepTarget-b),0);let streak=0;for(let s=selected;score(day(s))!=null;s=plus(s,-1))streak++;return heading('Performance analytics','See patterns, not just numbers. Metrics through the selected date.')+`<div class="grid four">${metric('Discipline average',pct(avg),`${ds.length} recorded days`,'◉')}${metric('Sleep average',sleepVals.length?fmt(mean(sleepVals))+'h':'—',sleepVals.length+' nights logged','☾')}${metric('Focus average',focus==null?'—':fmt(focus)+'/10','Self-reported focus','◎')}${metric('Logging streak',streak+'d','Consecutive recorded days','✳')}</div><div class="section"><h2>Progress dashboard</h2></div><div class="grid two"><div class="card"><h2>Weekly discipline</h2>${chart()}<p class="muted">Full 12-week program, including all saved dates.</p></div><div class="card"><h2>85-day consistency map</h2>${heat()}</div><div class="card stack"><h2>Habit performance</h2>${groups.map(g=>{const r=mean(ds.map(d=>ratio(d,g.habits.map(h=>h[0]))));return `<div><div class="row"><span>${g.name}</span><b>${pct(r)}</b></div>${progress(r||0)}</div>`}).join('')}</div><div class="card stack"><h2>Recovery insights</h2><div class="row"><span>Recorded nights meeting sleep target</span><b>${pct(sleepVals.length?sleepVals.filter(x=>x>=state.settings.sleepTarget).length/sleepVals.length:null)}</b></div><div class="row"><span>Sum of recorded nightly sleep shortfalls</span><b>${sleepVals.length?fmt(debt)+'h':'—'}</b></div><div class="row"><span>Sleep / discipline correlation</span><b>${corr==null?'—':corr.toFixed(2)}</b></div><div class="row"><span>Total deep work</span><b>${fmt(ds.reduce((a,d)=>a+deep(d),0)/60)}h</b></div><div class="notice">Correlations are descriptive, not causal. Sleep, energy and focus are self-reported. This dashboard does not diagnose burnout or measure dopamine.</div></div></div>`}
