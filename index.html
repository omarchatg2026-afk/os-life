storation, use the separate JSON backup.</p></body></html>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download='os-life-private-archive-'+today()+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Offline archive downloaded')}

const beforeIdeasAccount=accountPage;accountPage=function(){return beforeIdeasAccount()+`<div class="section"><h2>Independent backups</h2></div>${backupPanel()}`};


// V2.7: independently retained server snapshots, recovery UI and verified sync.
const RECOVERY_VERSION='2.7';
const PROTECTION_KEYS=['days','tasks','posts','library','okr','ideas','weeks','plans','goals','phases','wheel'];
let protectionRows=[],protectionDate='',protectionLoading=false,protectionError='',protectionPreview=null,protectionLimit=40,protectionApproval=null,protectionVerified=null;
function protectionCount(x,k){const v=x?.[k];return Array.isArray(v)?v.length:v&&typeof v==='object'?Object.keys(v).length:0}
function protectionLoss(old,next){const losses=[];for(const k of PROTECTION_KEYS){const a=protectionCount(old,k),b=protectionCount(next,k);if(a>0&&(b===0||(a-b>=2&&b/a<=.75))){losses.push(`${k}: ${a} → ${b}`);continue}const av=old?.[k],bv=next?.[k];const ids=v=>Array.isArray(v)?v.map(x=>x?.id).filter(Boolean):syncObject(v)?Object.keys(v):[];const before=ids(av),after=new Set(ids(bv));const missing=before.filter(x=>!after.has(x)).length;if(missing>=2&&missing/before.length>=.5)losses.push(`${k}: ${missing} previous records missing`)}return losses}
function protectionLocalCopy(kind,snapshot=state){try{const key=accountKey(LIFE_OWNER)+':recovery:'+kind+':'+Date.now();localStorage.setItem(key,JSON.stringify({created_at:new Date().toISOString(),kind,workspace:snapshot}));return true}catch{return false}}
function protectionBeforeUpgrade(){try{const key=accountKey(LIFE_OWNER),v=key+':backup-version';if(localStorage.getItem(v)===RECOVERY_VERSION)return;const raw=localStorage.getItem(key);if(raw&&!protectionLocalCopy('pre-update',JSON.parse(raw))){alert('Could not create local pre-update backup. Export your records before making changes.');return}localStorage.setItem(v,RECOVERY_VERSION)}catch{}}
function protectionDownload(snapshot,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}));a.download=name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function protectionLocalRows(){const rows=[];try{const prefix=accountKey(LIFE_OWNER)+':recovery:';for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(prefix)){const x=JSON.parse(localStorage.getItem(k));if(x?.workspace)rows.push({...x,key:k})}}}catch{}return rows.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))}
async function protectionCloudCopy(kind,snapshot,stamp=null){const t=await token();const result=await api('/rest/v1/os_life_backups','POST',{user_id:LIFE_OWNER,kind,source_updated_at:stamp,workspace:snapshot},t,{Prefer:'return=representation'});if(!result?.[0]?.id||!syncEqual(result[0].workspace,snapshot))throw Error('Backup could not be verified.');return result[0]}
function protectionFormat(t){return t?new Date(t).toLocaleString():'—'}
function protectionPanel(){const local=protectionLocalRows(),daily=protectionRows.find(r=>r.kind==='daily'),version=protectionRows.find(r=>r.kind==='version');return `<div class="section"><h2>Data Protection & Recovery</h2><span class="pill">V2.7</span></div><div class="grid two"><div class="card stack"><h3>Backup health</h3><div class="row"><span>Server daily snapshots</span><b>Scheduled · 90 days</b></div><div class="row"><span>Latest daily in results</span><b>${esc(protectionFormat(daily?.created_at))}</b></div><div class="row"><span>Latest prior version in results</span><b>${esc(protectionFormat(version?.created_at))}</b></div><div class="row"><span>Verified cloud read/write</span><b>${esc(protectionFormat(protectionVerified))}</b></div><p class="muted">Daily snapshots and previous versions are retained for 90 days. Manual and safety backups are not automatically deleted. Server backups remain within Supabase; independent downloads are recommended.</p><button class="primary" onclick="protectionManual()" ${protectionLoading?'disabled':''}>Create verified cloud backup</button><button onclick="protectionRefresh()" ${protectionLoading?'disabled':''}>Refresh backup history</button>${protectionError?note(protectionError):''}</div><div class="card stack"><h3>Local recovery copies</h3><p class="muted">On this browser only. Export them before clearing browser data.</p>${local.length?local.slice(0,10).map((r,i)=>`<div class="row"><span>${esc(r.kind)}<br><small>${esc(protectionFormat(r.created_at))}</small></span><button onclick="protectionLocalDownload(${i})">Download</button></div>`).join(''):'<p class="muted">No local safety snapshots on this device yet.</p>'}<button onclick="exportData()">Export full JSON</button><button onclick="downloadOfflineArchive()">Export readable archive</button></div></div><div class="card stack" style="margin-top:14px"><h3>Version history / Restore by date</h3><label>Backup creation date (your local time)<input type="date" value="${esc(protectionDate)}" onchange="protectionDate=this.value;protectionLimit=40;protectionRefresh()"></label><div class="row"><button onclick="protectionDate='';protectionLimit=40;protectionRefresh()">All dates</button><span class="muted">${protectionLoading?'Loading…':`${protectionRows.length} snapshots shown`}</span></div>${protectionRows.map(r=>`<div class="row" style="border-bottom:1px solid var(--line);padding:8px 0"><div><b>${esc(r.kind.replaceAll('-',' '))}</b><div class="muted">${esc(protectionFormat(r.created_at))}${r.backup_day?' · '+esc(r.backup_day):''}</div></div><button onclick="protectionInspect('${v2id(r.id)}')">Preview / restore</button></div>`).join('')||'<p class="muted">No matching backups loaded. Refresh to check the server.</p>'}${protectionRows.length===protectionLimit?'<button onclick="protectionLimit+=40;protectionRefresh()">Show more</button>':''}</div>`}
function protectionLocalDownload(i){const r=protectionLocalRows()[i];if(r)protectionDownload(r.workspace,'os-life-local-'+r.kind+'-'+r.created_at.slice(0,10))}
async function protectionRefresh(){if(!lifeUnlocked||protectionLoading)return;const epoch=syncEpoch;protectionLoading=true;protectionError='';if(page==='account')render();try{const t=await token();let q='/rest/v1/os_life_backups?select=id,kind,created_at,backup_day,source_updated_at&user_id=eq.'+LIFE_OWNER+'&order=created_at.desc&limit='+protectionLimit;if(protectionDate){const a=new Date(protectionDate+'T00:00:00'),b=new Date(a);b.setDate(b.getDate()+1);q+='&created_at=gte.'+encodeURIComponent(a.toISOString())+'&created_at=lt.'+encodeURIComponent(b.toISOString())}const rows=await api(q,'GET',undefined,t);if(epoch===syncEpoch&&lifeUnlocked)protectionRows=rows||[]}catch(e){if(epoch===syncEpoch)protectionError='History unavailable: '+e.message}finally{if(epoch===syncEpoch){protectionLoading=false;if(page==='account'&&!syncEditable())render()}}}
async function protectionManual(){if(!lifeUnlocked||protectionLoading)return;const epoch=syncEpoch;protectionLoading=true;try{await protectionCloudCopy('manual',cloneSync(state),syncStamp);if(epoch===syncEpoch)protectionError='Manual snapshot saved and verified.'}catch(e){if(epoch===syncEpoch)protectionError=e.message}finally{if(epoch===syncEpoch){protectionLoading=false;await protectionRefresh()}}}
async function protectionInspect(id){if(!lifeUnlocked||!v2id(id)||protectionLoading)return;const epoch=syncEpoch;protectionLoading=true;try{const t=await token(),rows=await api('/rest/v1/os_life_backups?select=*&id=eq.'+encodeURIComponent(id),'GET',undefined,t);if(epoch!==syncEpoch||!lifeUnlocked)return;const r=rows?.[0];if(!r)throw Error('Backup not found');protectionPreview=r;const snapshot=normalizeV2(r.workspace);const losses=protectionLoss(state,snapshot);$('dialog').innerHTML=`<h2>Backup preview</h2><p class="muted">${esc(r.kind)} · ${esc(protectionFormat(r.created_at))}</p><div class="grid two">${PROTECTION_KEYS.map(k=>`<div class="row"><span>${esc(k)}</span><b>${protectionCount(state,k)} → ${protectionCount(snapshot,k)}</b></div>`).join('')}</div>${losses.length?note('Restoring will reduce: '+losses.join(', ')):''}<details><summary>Inspect saved records</summary><div style="max-height:240px;overflow:auto;white-space:normal;overflow-wrap:anywhere">${archiveValue(snapshot)}</div></details><p class="muted">Restore missing items without replacing existing records, or explicitly replace the workspace. Both require a safety backup first.</p><div class="idea-tabs"><button onclick="protectionDownloadPreview()">Download snapshot</button><button onclick="protectionRestore(true)">Recover missing items</button><button class="danger" onclick="protectionRestore(false)">Restore entire workspace</button><button onclick="$('dialog').close()">Close</button></div>`;$('dialog').showModal()}catch(e){if(epoch===syncEpoch)toast(e.message)}finally{if(epoch===syncEpoch)protectionLoading=false}}
function protectionDownloadPreview(){if(lifeUnlocked&&protectionPreview)protectionDownload(protectionPreview.workspace,'os-life-snapshot-'+protectionPreview.created_at.slice(0,10))}
function protectionRecoverMissing(current,old){const result=cloneSync(current);for(const k of PROTECTION_KEYS){const a=result[k],b=old[k];if(Array.isArray(a)&&Array.isArray(b)){const ids=new Set(a.map(x=>x?.id).filter(Boolean));for(const x of b)if(x?.id&&!ids.has(x.id)){a.push(cloneSync(x));ids.add(x.id)}}else if(syncObject(a)&&syncObject(b)){for(const key of Object.keys(b))if(!['__proto__','constructor','prototype'].includes(key)&&!Object.hasOwn(a,key))a[key]=cloneSync(b[key])}}return result}
async function protectionRestore(missingOnly){if(!lifeUnlocked||!protectionPreview||protectionLoading||syncRunning||syncConflict){toast('Resolve any sync conflict first, then retry.');return}const epoch=syncEpoch,previous=cloneSync(state),snapshot=normalizeV2(protectionPreview.workspace),next=missingOnly?protectionRecoverMissing(previous,snapshot):snapshot;if(!confirm(missingOnly?'Recover missing records without replacing current records?':'Replace the entire workspace with this snapshot? Your current records will be backed up first.'))return;protectionLoading=true;try{if(!protectionLocalCopy('pre-restore',previous))throw Error('Local safety backup failed. Export current records first.');const remote=await getRemote();if(epoch!==syncEpoch||!lifeUnlocked)return;await protectionCloudCopy('pre-restore',previous,syncStamp);if(remote&&!syncEqual(remote.workspace,previous))await protectionCloudCopy('pre-restore',remote.workspace,remote.updated_at);if(epoch!==syncEpoch||!lifeUnlocked)return;if(!syncEqual(previous,state))throw Error('Workspace changed during backup. Reopen preview and retry.');if(remote&&syncBase&&!syncEqual(normalizeV2(remote.workspace),syncBase)){markSyncConflict(remote,['Cloud changed before restore']);throw Error('Cloud changed. Resolve the conflict before restoring.')}syncBase=remote?normalizeV2(remote.workspace):null;syncStamp=remote?.updated_at||null;persistSyncMeta();protectionApproval={snapshot:cloneSync(next),stamp:syncStamp};state=next;storeSyncLocal();$('dialog').close();render();await syncNow({force:true});toast(syncConflict?'Restore needs conflict review':syncStatus.startsWith('Synced')?'Restored and verified':'Restored locally; cloud sync not yet verified')}catch(e){if(epoch===syncEpoch)toast(e.message)}finally{if(epoch===syncEpoch)protectionLoading=false}}
const preProtectionAccount=accountPage;accountPage=function(){return preProtectionAccount()+protectionPanel()};
const preProtectionGo=go;go=function(p){preProtectionGo(p);if(p==='account'&&lifeUnlocked)protectionRefresh()};
const preProtectionLock=lockLife;lockLife=function(message=''){protectionRows=[];protectionPreview=null;protectionApproval=null;protectionVerified=null;protectionLoading=false;protectionError='';return preProtectionLock(message)};
const preProtectionInit=initLifeSync;initLifeSync=async function(){protectionBeforeUpgrade();return preProtectionInit()};
const preProtectionResolve=resolveLifeSync;resolveLifeSync=async function(which){if(!syncConflict||syncRunning||!lifeUnlocked)return;const conflict=syncConflict,epoch=syncEpoch;if(!protectionLocalCopy('conflict-device',state)||!protectionLocalCopy('conflict-cloud',conflict.remote)){toast('Safety backup failed. Download both copies first.');return}if(which==='device')protectionApproval={snapshot:cloneSync(state),stamp:conflict.stamp};try{if(navigator.onLine){await protectionCloudCopy('conflict',cloneSync(state),syncStamp);await protectionCloudCopy('conflict',conflict.remote,conflict.stamp)}if(epoch!==syncEpoch||!lifeUnlocked||syncConflict!==conflict)return;return await preProtectionResolve(which)}catch(e){toast('Conflict backup failed: '+e.message)}finally{protectionApproval=null}};
const preProtectionSave=save;save=function(){if(lifeUnlocked&&auth?.user?.id===LIFE_OWNER){try{const raw=localStorage.getItem(accountKey(LIFE_OWNER));if(raw){const previous=JSON.parse(raw);const losses=protectionLoss(previous,state);if(losses.length&&!protectionLocalCopy('before-local-reduction',previous)){state=normalizeV2(previous);toast('Safety backup failed; previous device records retained. Export a backup first.');return}}}catch{}}return preProtectionSave()};
// Guard local import as well as sync, while retaining the previous local state.
const preProtectionImport=importData;importData=function(e){if(!lifeUnlocked)return;const file=e.target.files?.[0];if(!file)return;if(!protectionLocalCopy('pre-restore',state)){toast('Safety backup failed. Export current records first.');return}preProtectionImport(e)};

</script></body></html>
