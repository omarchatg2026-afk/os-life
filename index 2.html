'use strict';const SEED=JSON.parse(document.getElementById('seed').textContent),KEY='os-life-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch{state=structuredClone(SEED)};let page='overview',selected=today(),timerLeft=25*60,timerEnd=0,timerInterval=null,timerDate=null,timerKind='study',toastT;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),num=v=>Number(v)||0,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),pct=v=>v==null?'—':Math.round(v*100)+'%',fmt=(v,n=1)=>v==null?'—':Number(v).toFixed(n).replace(/\.0$/,''),has=(d,k)=>d[k]!==undefined&&d[k]!==null&&d[k]!=='';function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function plus(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function daynum(s){return Math.round((Date.parse(s)-Date.parse(state.settings.start))/86400000)+1}function weeknum(s){return clamp(Math.ceil(daynum(s)/7),1,12)}function day(s=selected){return state.days[s]||{}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Storage unavailable. Export a backup to retain your changes.')}}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),2500)}function setDay(k,v){const d=state.days[selected]??={};if(v===''||v==null)delete d[k];else d[k]=v;if(!Object.keys(d).length)delete state.days[selected];save();render()}function selectDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||!Number.isFinite(Date.parse(s)))return;selected=s;render()}function shiftDate(n){selectDate(plus(selected,n))}function go(p){page=p;$('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant ,'meal'])||0)*.15+(ratio(d,['speaking','listening','vocab','grammar'])||0)*.15+(d.research===true?.1:0)+(d.screenBefore===true?.05:0)+(sl>=state.settings.sleepTarget?.05:sl>=6?.025:0)+(d.screenLow===true?.1:0)+(d.noMusic===true?.1:0)}function mean(xs){const a=xs.filter(x=>x!==null&&x!==undefined&&Number.isFinite(x));return a.length?a.reduce((a,b)=>a+b,0)/a.length:null}function logged(s){return Object.entries(state.days).filter(([k,d])=>k<=s&&score(d)!=null).sort(([a],[b])=>a.localeCompare(b))}function rangeDays(start,n){return Array.from({length:n},(_,i)=>plus(start,i))}function weekDays(w){return rangeDays(plus(state.settings.start,(w-1)*7),w===12?8:7)}function weekScore(w){return mean(weekDays(w).map(s=>score(day(s))))}function phase(w){return w<=4?'Foundation':w<=8?'Velocity':'Peak'}function grade(s){return s==null?'No data':s>=.9?'S-tier':s>=.7?'A-tier':s>=.5?'B-tier':'C-tier'}function deep(d){return num(d.englishMinutes)+(has(d,'researchMinutes')?num(d.researchMinutes):d.research===true?20:0)+num(d.focusMinutes)}function progress(v){return `<div class="line"><i style="width:${clamp(v*100,0,100)}%"></i></div>`}function heading(t,s){return `<div class="heading"><h1>${t}</h1><p>${s}</p></div>`}function metric(t,v,s,i){return `<div class="card metric"><span class="ico">${i}</span><span class="muted">${t}</span><span class="value">${v}</span><span class="muted">${s}</span></div>`}function heat(){return `<div class="heat">${rangeDays(state.settings.start,85).map((s,i)=>{const sc=score(day(s));return `<button class="${s===selected?'sel':''}" title="${esc(s)} · ${pct(sc)}" style="${sc==null?'':`background:hsl(111 25% ${91-sc*46}%);color:${sc>.65?'white':'#334b36'}`}" onclick="selectDate('${s}');go('daily')">${i+1}</button>`}).join('')}</div><div class="row muted" style="margin-top:10px"><span>85-day program · click any day</span><span>Blank → recorded → high score</span></div>`}function chart(){return `<div class="weekbar">${Array.from({length:12},(_,i)=>{const s=weekScore(i+1);return `<div title="Week ${i+1}: ${pct(s)}"><small>${s==null?'—':Math.round(s*100)}</small><div class="bar" style="height:${s==null?3:Math.max(3,s*100)}%;opacity:${s==null?.25:1}"></div><small>W${i+1}</small></div>`}).join('')}</div>`}function taskList(){const ts=state.tasks.filter(t=>t.date===selected);return `<form class="formrow" onsubmit="addTask(event)"><input name="title" required placeholder="What needs to get done?" maxlength="180" aria-label="Task"><select name="priority" aria-label="Priority" style="width:100px"><option>Normal</option><option>High</option><option>Low</option></select><button class="primary">＋ Add</button></form>${ts.length?ts.map(t=>`<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" onclick="toggleTask('${t.id}')" aria-label="Toggle task">${t.done?'✓':''}</button><div class="taskbody">${esc(t.title)} <span class="tag">${esc(t.priority)}</span>${t.time?` <small>${esc(t.time)}</small>`:''}</div><button class="quiet" onclick="editTask('${t.id}')" aria-label="Edit task">✎</button><button class="quiet" onclick="deleteTask('${t.id}')" aria-label="Delete task">×</button></div>`).join(''):'<div class="empty">A clear day. Add your first priority.</div>'}`}function addTask(e){e.preventDefault();const f=new FormData(e.target);state.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:selected,title:String(f.get('title')).trim(),priority:f.get('priority'),done:false,time:''});save();render()}function toggleTask(id){const t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render()}function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();render()}function editTask(id){const t=state.tasks.find(t=>t.id===id);$('dialog').innerHTML=`<h2>Edit task</h2><form class="stack" onsubmit="saveTask(event,'${id}')"><label>Task<input required name="title" value="${esc(t.title)}"></label><label>Scheduled time<input name="time" type="time" value="${esc(t.time)}"></label><label>Date<input required name="date" type="date" value="${esc(t.date)}"></label><div class="row"><button type="button" onclick="$('dialog').close()">Cancel</button><button class="primary">Save</button></div></form>`;$('dialog').showModal()}function saveTask(e,id){e.preventDefault();const f=new FormData(e.target),t=state.tasks.find(t=>t.id===id);Object.assign(t,{title:f.get('title'),time:f.get('time'),date:f.get('date')});$('dialog').close();save();render()}function timerCard(){return `<div class="card"><div class="row"><h2>Focus session</h2><span class="pill">Deep work</span></div><div class="timer" id="timerText">${timerFormat()}</div><div class="fieldgrid"><label>Duration<select id="timerDuration" ${timerEnd?'disabled':''} onchange="setTimer(this.value)">${[15,25,45,50,60].map(x=>`<option value="${x}" ${Math.ceil(timerInitial/60)===x?'selected':''}>${x} min</option>`).join('')}</select></label><label>Category<select ${timerEnd?'disabled':''} onchange="timerKind=this.value">${['study','english','research','content'].map(x=>`<option ${timerKind===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="row" style="margin-top:12px"><button class="primary" onclick="startPause()">${timerEnd?'Pause':'Start focus'}</button><button onclick="finishTimer()">Log & reset</button><button class="quiet" onclick="resetTimer()">Reset</button></div><p class="muted">Completed sessions add to the selected day's focus minutes.</p></div>`}let timerInitial=1500;function timerFormat(){const t=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerLeft;return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}function setTimer(v){timerLeft=timerInitial=Number(v)*60;render()}function startPause(){if(timerEnd){timerLeft=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=0;clearInterval(timerInterval)}else{if(!timerDate)timerDate=selected;timerEnd=Date.now()+timerLeft*1000;timerInterval=setInterval(()=>{if($('timerText'))$('timerText').textContent=timerFormat();if(Date.now()>=timerEnd){timerLeft=0;timerEnd=0;clearInterval(timerInterval);finishTimer()}},250)}render()}function resetTimer(){clearInterval(timerInterval);timerEnd=0;timerLeft=timerInitial;timerDate=null;render()}function finishTimer(){if(timerEnd)timerLeft=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));const minutes=Math.floor((timerInitial-timerLeft)/60);if(minutes>0){const d=state.days[timerDate||selected]??={};if(timerKind==='english')d.englishMinutes=num(d.englishMinutes)+minutes;else if(timerKind==='research')d.researchMinutes=num(d.researchMinutes)+minutes;else if(timerKind==='content')d.contentMinutes=num(d.contentMinutes)+minutes;else d.focusMinutes=num(d.focusMinutes)+minutes;save();toast(`${minutes} minutes logged`)}resetTimer()}
function overview(){const d=day(),sc=score(d),all=logged(selected),w=weeknum(selected),sl=sleep(d),tasks=state.tasks.filter(t=>t.date===selected),avg=mean(all.map(([,d])=>score(d))),current=daynum(selected);return `<div class="hero"><div><div class="eyebrow">${esc(dateLabel(selected))} · ${current>=1&&current<=85?'Week '+w+' / '+phase(w):'Personal workspace'}</div><h1>Build the life<br>you want to live.</h1><p>One intentional day at a time. Your system is here to make progress visible, not to punish missed days.</p><button onclick="go('daily')">Open daily check-in →</button></div><div class="ring" style="--pct:${(sc||0)*100}%"><div><b>${pct(sc)}</b><small>Today's discipline</small></div></div></div><div class="grid four">${metric('Overall discipline',pct(avg),`${all.length} recorded days`,'◉')}${metric('Sleep duration',sl==null?'—':fmt(sl)+'h',`Target ${state.settings.sleepTarget} hours`,'☾')}${metric('Deep work',fmt(deep(d),0)+'m','English + research + focus','◈')}${metric('Daily priorities',`${tasks.filter(t=>t.done).length}/${tasks.length}`,'Tasks completed','✓')}</div><div class="section"><h2>Your life pillars</h2><button class="quiet" onclick="go('daily')">View all →</button></div><div class="grid split"><div class="card stack">${groups.map(g=>{const v=ratio(d,g.habits.map(h=>h[0]));return `<div><div class="row"><span>${g.icon} &nbsp; <b>${g.name}</b></span><span class="muted">${pct(v)}</span></div><div style="margin-top:7px">${progress(v||0)}</div></div>`}).join('')}</div><div class="card"><div class="row"><h2>Today's priorities</h2><span class="pill">${tasks.length} tasks</span></div><div style="margin-top:12px">${taskList()}</div></div></div><div class="section"><h2>Consistency over time</h2><button class="quiet" onclick="go('analytics')">Analytics →</button></div><div class="grid two"><div class="card"><h2>Discipline by week</h2>${chart()}</div><div class="card"><h2>Program calendar</h2>${heat()}</div></div>`}
function habitRow(h,d){const v=d[h[0]];return `<div class="habit"><div class="desc"><b>${esc(h[1])}</b>${h[2]?`<div class="muted">${esc(h[2])}</div>`:''}</div><div class="toggle"><button class="${v===true?'yes':''}" onclick="setDay('${h[0]}',true)" aria-label="${esc(h[1])}: done" aria-pressed="${v===true}">✓</button><button class="${v===false?'no':''}" onclick="setDay('${h[0]}',false)" aria-label="${esc(h[1])}: missed" aria-pressed="${v===false}">×</button><button class="${v==null?'none':''}" onclick="setDay('${h[0]}',null)" aria-label="${esc(h[1])}: clear">–</button></div></div>`}function field(d,k,title,type='number',min=0,max=1440){return `<label>${title}<input type="${type}" ${type==='number'?`min="${min}" max="${max}" step="1"`:''} value="${esc(d[k])}" onchange="if(this.reportValidity())setDay('${k}',this.value===''?null:${type==='number'?'Number(this.value)':'this.value'})"></label>`}function daily(){const d=day(),sl=sleep(d),sc=score(d);return heading('Daily check-in',`${esc(dateLabel(selected))} · Mark complete, missed or leave unrecorded.`)+`<div class="grid four">${metric('Discipline',pct(sc),grade(sc),'◉')}${metric('Habits completed',`${habitKeys.filter(k=>d[k]===true).length}/${habitKeys.length}`,'Today’s checklist','✓')}${metric('Sleep',sl==null?'—':fmt(sl)+'h',sl==null?'Log bed & wake time':fmt(Math.max(0,state.settings.sleepTarget-sl))+'h below target','☾')}${metric('Deep work',deep(d)+'m','Minutes logged','◈')}</div><div class="section"><h2>Daily routines</h2><span class="muted">Changes save automatically</span></div><div class="grid two">${groups.map(g=>`<div class="card"><div class="row"><div><h2>${g.icon} &nbsp;${g.name}</h2><span class="muted">${g.sub}</span></div><span class="pill">${pct(ratio(d,g.habits.map(h=>h[0])))}</span></div><div style="margin-top:8px">${g.habits.map(h=>habitRow(h,d)).join('')}</div>${g.name==='Fitness'?field(d,'trainingMinutes','Training duration (min)'):g.name==='English mastery'?field(d,'englishMinutes','English study function planner(){return heading('Daily planner','Prioritize the important work before filling the calendar.')+`<div class="grid split"><div class="card"><h2>Tasks & time blocks</h2><p class="muted">${esc(dateLabel(selected))} · Use the pencil to schedule a task or move it to another day.</p>${taskList()}</div>${timerCard()}</div><div class="section"><h2>Long-term goals</h2></div><div class="card"><form class="formrow" onsubmit="addGoal(event)"><input name="title" required placeholder="New goal" aria-label="Goal title"><input name="target" type="number" min="1" required placeholder="Target" aria-label="Target" style="max-width:110px"><input name="unit" placeholder="Unit (e.g. hours)" aria-label="Unit" style="max-width:150px"><button class="primary">Add goal</button></form>${state.goals.length?state.goals.map(g=>`<div class="goal"><div class="row"><b>${esc(g.title)}</b><span class="muted">${num(g.current)}/${num(g.target)} ${esc(g.unit)}</span></div>${progress(num(g.current)/num(g.target))}<div class="row" style="margin-top:8px"><input type="number" min="0" value="${num(g.current)}" aria-label="Current progress" style="max-width:130px" onchange="updateGoal('${g.id}',this.value)"><button class="quiet" onclick="removeGoal('${g.id}')">Remove</button></div></div>`).join(''):'<div class="empty">Set a measurable goal to see your progress.</div>'}</div>`}function addGoal(e){e.preventDefault();const f=new FormData(e.target);state.goals.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:f.get('title'),target:Number(f.get('target')),unit:f.get('unit'),current:0});save();render()}function updateGoal(id,v){const g=state.goals.find(g=>g.id===id);g.current=Math.max(0,num(v));save();render()}function removeGoal(id){state.goals=state.goals.filter(g=>g.id!==id);save();render()}
function correlation(pairs){const a=pairs.filter(([x,y])=>x!=null&&y!=null&&Number.isFinite(x)&&Number.isFinite(y));if(a.length<3)return null;const x=mean(a.map(p=>p[0])),y=mean(a.map(p=>p[1]));let n=0,xx=0,yy=0;for(const [u,v] of a){n+=(u-x)*(v-y);xx+=(u-x)**2;yy+=(v-y)**2}return xx&&yy?n/Math.sqrt(xx*yy):null}function analytics(){const all=logged(selected),ds=all.map(([,d])=>d),sleepVals=ds.map(sleep).filter(x=>x!=null),avg=mean(ds.map(score)),focus=mean(ds.map(d=>has(d,'focus')?num(d.focus):null)),corr=correlation(ds.map(d=>[sleep(d),score(d)])),debt=sleepVals.reduce((a,b)=>a+Math.max(0,state.settings.sleepTarget-b),0);let streak=0;for(let s=selected;score(day(s))!=null;s=plus(s,-1))streak++;return heading('Performance analytics','See patterns, not just numbers. Metrics through the selected date.')+`<div class="grid four">${metric('Discipline average',pct(avg),`${ds.length} recorded days`,'◉')}${metric('Sleep average',sleepVals.length?fmt(mean(sleepVals))+'h':'—',sleepVals.length+' nights logged','☾')}${metric('Focus average',focus==null?'—':fmt(focus)+'/10','Self-reported focus','◎')}${metric('Logging streak',streak+'d','Consecutive recorded days','✳')}</div><div class="section"><h2>Progress dashboard</h2></div><div class="grid two"><div class="card"><h2>Weekly discipline</h2>${chart()}<p class="muted">Full 12-week program, including all saved dates.</p></div><div class="card"><h2>85-day consistency map</h2>${heat()}</div><div class="card stack"><h2>Habit performance</h2>${groups.map(g=>{const r=mean(ds.map(d=>ratio(d,g.habits.map(h=>h[0]))));return `<div><div class="row"><span>${g.name}</span><b>${pct(r)}</b></div>${progress(r||0)}</div>`}).join('')}</div><div class="card stack"><h2>Recovery insights</h2><div class="row"><span>Recorded nights meeting sleep target</span><b>${pct(sleepVals.length?sleepVals.filter(x=>x>=state.settings.sleepTarget).length/sleepVals.length:null)}</b></div><div class="row"><span>Sum of recorded nightly sleep shortfalls</span><b>${sleepVals.length?fmt(debt)+'h':'—'}</b></div><div class="row"><span>Sleep / discipline correlation</span><b>${corr==null?'—':corr.toFixed(2)}</b></div><div class="row"><span>Total deep work</span><b>${fmt(ds.reduce((a,d)=>a+deep(d),0)/60)}h</b></div><div class="notice">Correlations are descriptive, not causal. Sleep, energy and focus are self-reported. This dashboard does not diagnose burnout or measure dopamine.</div></div></div>`}
function setWeek(w,k,v){const r=state.weeks[w]??={};if(v==='')delete r[k];else r[k]=v;save();render()}function weekInput(w,r,k,t,type='number',max=10){return `<label>${t}<input ${type==='number'?`type="number" min="0" max="${max}" step="any"`:'type="text"'} value="${esc(r[k])}" onchange="if(this.reportValidity())setWeek(${w},'${k}',${type==='number'?"this.value===''?'':Number(this.value)":'this.value'})"></label>`}function review(){const w=weeknum(selected),r=state.weeks[w]||{},days=weekDays(w).map(s=>day(s)),s=weekScore(w);return heading('Weekly & phase review','Reflect, adjust, and plan the next week.')+`<div class="card"><div class="row"><div><h2>Week ${w} · ${phase(w)}</h2><span class="muted">${weekDays(w)[0]} → ${weekDays(w).at(-1)}</span></div><select aria-label="Select review week" style="width:105px" onchange="selectDate(weekDays(Number(this.value))[0])">${Array.from({length:12},(_,i)=>`<option ${w===i+1?'selected':''} value="${i+1}">Week ${i+1}</option>`).join('')}</select></div><div class="grid four" style="margin-top:15px">${metric('Discipline',pct(s),grade(s),'◉')}${metric('Reward points',s==null?'—':Math.floor(s*150),'Workbook weekly points','✳')}${metric('Deep work',fmt(days.reduce((a,d)=>a+deep(d),0)/60)+'h','Logged time','◈')}${metric('Sleep average',mean(days.map(sleep))==null?'—':fmt(mean(days.map(sleep)))+'h','Recorded nights','☾')}</div></div><div class="section"><h2>Review & skill development</h2></div><div class="grid two"><div class="card stack"><h2>Weekly reflection</h2>${['Wins','Challenges','Next week focus'].map((t,i)=>`<label>${t}<textarea onchange="setWeek(${w},'${['wins','challenges','next'][i]}',this.value)">${esc(r[['wins','challenges','next'][i]])}</textarea></label>`).join('')}</div><div class="card stack"><h2>English skills</h2><div class="fieldgrid">${['Speaking','Listening','Vocabulary','Pronunciation','Confidence'].map(t=>weekInput(w,r,t.toLowerCase(),t+' (0–10)')).join('')}<label>CEFR level (self-reported)<select onchange="setW function setSetting(k,v){state.settings[k]=v;save();render()}function postUpdate(id,k,v){const p=state.posts.find(p=>p.id===id);p[k]=v;save();render()}function postAdd(){state.posts.push({id:'P-'+(crypto.randomUUID?crypto.randomUUID():Date.now()),title:'',type:'Reel',status:'Idea',date:'',reach:null,engagement:null,saves:null,conversion:null});save();render()}function postDelete(id){if(confirm('Remove this content item?')){state.posts=state.posts.filter(p=>p.id!==id);save();render()}}function postInput(p,k,type='text'){return `<input aria-label="${k}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(p[k])}" onchange="if(this.reportValidity())postUpdate('${p.id}','${k}',${type==='number'?"this.value===''?null:Number(this.value)":'this.value'})">`}function postSelect(p,k,opts){return `<select aria-label="${k}" onchange="postUpdate('${p.id}','${k}',this.value)">${opts.map(x=>`<option ${p[k]===x?'selected':''}>${x}</option>`).join('')}</select>`}function content(){const st=state.settings,rate=st.growth/100,eta=st.followers>=st.target?0:st.followers>0&&rate>0?Math.ceil(Math.log(st.target/st.followers)/Math.log(1+rate)):null,week=weekDays(weeknum(selected)),posted=state.posts.filter(p=>p.status==='Published'&&week.includes(p.date)),reels=posted.filter(p=>p.type==='Reel').length,car=posted.filter(p=>p.type==='Carousel').length;return heading('Creator studio','Plan, publish and track Instagram and YouTube content.')+`<div class="grid four">${metric('Followers',num(st.followers).toLocaleString(),`Goal ${num(st.target).toLocaleString()}`,'◎')}${metric('Target progress',pct(st.followers/st.target),'Instagram growth','↗')}${metric('Reels this week',`${reels}/${st.uploadTarget}`,'Published & dated','▷')}${metric('Carousels this week',`${car}/${st.carouselTarget}`,'Published & dated','▤')}</div><div class="section"><h2>Growth goals</h2></div><div class="card stack"><div class="fieldgrid">${[['followers','Current followers'],['target','Target followers'],['growth','Expected weekly growth (%)']].map(([k,t])=>`<label>${t}<input type="number" min="${k==='target'?1:0}" step="any" value="${esc(st[k])}" onchange="if(this.reportValidity()&&this.value!=='')setSetting('${k}',Number(this.value))"></label>`).join('')}</div>${progress(st.followers/st.target)}<p class="muted">${eta==null?'No projection available.':eta===0?'Target achieved.':`About ${eta} weeks to target if the assumed percentage growth continues.`} Projection is not a guarantee.</p></div><div class="section"><h2>Content pipeline</h2><button class="primary" onclick="postAdd()">＋ New content</button></div><div class="card tablewrap"><table><thead><tr>${['Title / ID','Type','Status','Publish date','Reach','Engagement %','Saves','Conversions','Score',''].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${state.posts.map(p=>{const v=num(p.reach)>0?Math.min(100,Math.floor(num(p.engagement)*4+num(p.saves)/num(p.reach)*500)):null;return `<tr><td>${postInput(p,'title')}<div class="muted">${esc(p.id.startsWith('IG-')?p.id:'New item')}</div></td><td>${postSelect(p,'type',['Reel','Carousel','Story','YouTube'])}</td><td>${postSelect(p,'status',['Idea','Draft','Editing','Scheduled','Published'])}</td><td>${postInput(p,'date','date')}</td><td>${postInput(p,'reach','number')}</td><td>${postInput(p,'engagement','number')}</td><td>${postInput(p,'saves','number')}</td><td>${postInput(p,'conversion','number')}</td><td>${v==null?'—':v}</td><td><button class="quiet" onclick="postDelete('${p.id}')" aria-label="Remove post">×</button></td></tr>`}).join('')}</tbody></table></div><p class="muted">Content score uses your spreadsheet's engagement and saves formula. No live social media connection.</p>`}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='os-life-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')}function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||typeof x.days!=='object'||!x.days||!Array.isArray(x.posts)||!Array.isArray(x.tasks)||!x.settings||!/^\d{4}-\d{2}-\d{2}$/.test(x.settings.start))throw Error('Invalid backup');if(!confirm('Replace your current workspace with this backup?'))return;state={...structuredClone(SEED),...x,settings:{...SEED.settings,...x.settings}};save();render();toast('Backup restored')}catch{toast('Could not import: invalid OS Life backup')}};reader.readAsText(f)}function settings(){const st=state.settings;return heading('Settings & data','Make the system yours. Your information remains in your browser.')+`<div class="grid two"><div class="card stack"><h2>Program settings</h2><label>Program start date<input type="date" value="${esc(st.start)}" onchange="if(this.value)setSetting('start',this.value)"></label><label>Sleep target (hours)<input type="number" min="5" max="12" step="0.5" value="${esc(st.sleepTarget)}" onchange="if(this.reportValidity()&&this.value)setSetting('sleepTarget',Number(this.value))"></label><label>Weekly Reel / upload target<input type="number" min="0" max="100" value="${esc(st.uploadTarget)}" onchange="if(this.reportValidity()&&this.value)setSetting('uploadTarget',Number(this.value))"></label><label>Weekly carousel target<input type="number" min="0" max="100" value="${esc(st.carouselTarget)}" onchange="if(this.reportValidity()&&this.value)setSetting('carouselTarget',Number(this.value))"></label><label>Appearance<select onchange="setSetting('theme',this.value)"><option value="light" ${st.theme!=='dark'?'selected':''}>Light</option><option value="dark" ${st.theme==='dark'?'selected':''}>Dark</option></select></label><p class="muted">Changing the start date shifts the program calendar, not historical entries.</p></div><div class="card stack"><h2>Data ownership</h2><p>Your workspace starts empty. Records are saved locally; no account, server, or live cloud sync is enabled.</p><button class="primary" onclick="exportData()">Export JSON backup</button><label>Restore a backup<input type="file" accept=".json,application/json" onchange="importData(event)"></label><div class="notice">Your records are not embedded in the published website. Browser storage can be cleared, so export backups regularly.</div><button class="danger" onclick="if(confirm('Reset all records to the empty workspace?')){state=structuredClone(SEED);save();render();toast('Workspace reset')}">Reset workspace</button></div></div><div class="section"><h2>Discipline formula</h2></div><div class="card"><p>Morning 30% · Workout 15% · English 15% · Research 10% · Screen-free before sleep 5% · Sleep duration 5% · Low screen time 10% · No music violation 10%.</p><p class="muted">Same weights as your workbook. Sleep contributes 5% at your chosen target and 2.5% from six hours to below target. Content creation and no random social media are tracked separately, not included in the original weighted score.</p></div>`}const navs=[['overview','◉','Overview'],['daily','✓','Daily check-in'],['planner','▦','Planner & focus'],['analytics','↗','Analytics'],['review','▤','Weekly review'],['content','◎','Creator studio'],['settings','⚙','Settings']];function render(){document.body.classList.toggle('dark',state.settings.theme==='dark');$('selectedDate').value=selected;$('nav').innerHTML=navs.map(([p,i,l])=>`<button class="nav ${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join('');$('crumb').textContent='WORKSPACE / '+navs.find(n=>n[0]===page)[2].toUpperCase();$('sideProgress').style.width=clamp(daynum(today())/85*100,0,100)+'%';$('
